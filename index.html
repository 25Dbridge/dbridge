<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임상병리사의 바이오 진출 로드맵 · D-Bridge</title>

<meta name="description" content="동서대학교 임상병리학과 재학생 5인이 일본 고베 의료산업도시와 국내 신약개발 기업을 현장 조사하여 정리한 비임상 진로 안내">
<meta name="theme-color" content="#201D2B">

<meta property="og:type" content="website">
<meta property="og:title" content="임상병리사의 바이오 진출 로드맵 · D-Bridge">
<meta property="og:description" content="Carna Biosciences · RIKEN BDR · FBRI · 고베대학 BiCLET | 펩트론 · 지투지바이오 · 인코스팜">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://25dbridge.github.io/dbridge/">

<!-- ★ og-image.png 를 index.html 옆에 올린 뒤 이 주소가 맞는지 확인하세요 -->
<meta property="og:image" content="https://25dbridge.github.io/dbridge/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- 파비콘 : 별도 파일 없이 문자 하나로 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23201D2B'/%3E%3Cpath d='M20 44V20h9c7 0 11 4.5 11 12s-4 12-11 12z' fill='%23F6F5F8'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>

<body>
<a class="skip-link" href="#paths">본문으로 건너뛰기</a>

<noscript>
  <p class="noscript">이 페이지는 자바스크립트로 내용을 표시합니다. 브라우저 설정에서 자바스크립트를 켜고 새로고침해 주세요.</p>
</noscript>

<!-- 상단 고정 내비게이션 (모바일에서는 숨김) -->
<nav class="sticky-nav">
  <div class="sticky-nav__inner">
    <span class="sticky-nav__logo">D-Bridge</span>
    <ul class="sticky-nav__links">
      <li><a href="#paths">비임상 진출 경로</a></li>
      <li><a href="#labs">학과 연구실</a></li>
      <li><a href="#roadmap">학년별 로드맵</a></li>
      <li><a href="#checklist">자가 진단</a></li>
      <li><a href="#visits">다녀온 곳</a></li>
    </ul>
  </div>
</nav>

<!-- 1. 첫 화면 -->
<header class="hero" id="hero">
  <div class="hero__bg" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?q=80&w=2000&auto=format&fit=crop" alt="" loading="eager" decoding="async">
  </div>

  <div class="hero__inner">
    <h1 class="hero__question" data-render="hero-question"></h1>
    <p class="hero__answer" data-render="hero-answer"></p>
    <dl class="hero__stats" data-render="hero-stats"></dl>
    <p class="hero__byline" data-render="hero-byline"></p>
    <p class="hero__team"   data-render="hero-team"></p>
  </div>
</header>

<main>
  <!-- 2. 세 경로 -->
  <section class="paths" id="paths" aria-labelledby="paths-title">
    <h2 class="section__title" id="paths-title">비임상 진출 경로 3가지</h2>
    <ul class="paths__list" data-render="paths"></ul>
  </section>

  <!-- 2b. 학과 연구실 -->
  <section class="labs" id="labs" aria-labelledby="labs-title">
    <h2 class="section__title" id="labs-title" data-render="labs-heading"></h2>
    <p class="labs__note" data-render="labs-note"></p>
    <ul class="labs__list" data-render="labs"></ul>
  </section>

  <!-- 3. 로드맵 -->
  <section class="roadmap" id="roadmap" aria-labelledby="roadmap-title">
    <h2 class="section__title" id="roadmap-title">학년별 진로 준비 로드맵</h2>
    <p class="roadmap__notice" data-render="roadmap-notice" role="note"></p>
    <ol class="timeline" role="list" data-render="timeline"></ol>
    <div class="roadmap__closing" data-render="roadmap-closing"></div>
  </section>

  <!-- 4. 체크리스트 -->
  <section class="checklist" id="checklist" aria-labelledby="checklist-title">
    <header class="checklist__head">
      <h2 class="section__title" id="checklist-title">진로 준비도 자가 진단</h2>
      <button type="button" class="btn btn--outline" id="btn-show-programs">비교과 프로그램 모아보기</button>
    </header>

    <div class="grades" role="tablist" aria-label="학년 선택" data-render="grade-tabs"></div>

    <form class="check" id="check-form" role="tabpanel" aria-label="선택한 학년의 점검 문항">
      <fieldset class="check__group" data-group="now">
        <legend class="check__legend" data-render="legend-now"></legend>
        <ul class="check__list" data-render="items-now"></ul>
      </fieldset>
      <hr class="check__divider">
      <fieldset class="check__group" data-group="ongoing">
        <legend class="check__legend" data-render="legend-ongoing"></legend>
        <ul class="check__list" data-render="items-ongoing"></ul>
      </fieldset>
    </form>

    <div class="result" id="result" aria-live="polite">
      <h3 class="result__heading" data-render="result-heading"></h3>
      <ul class="result__list"    data-render="result-list"></ul>
      <div class="result__preview" data-render="result-preview" hidden></div>
      <div class="result__done" data-render="result-done" hidden></div>
      <div class="result__actions">
        <button type="button" class="btn" data-action="save-image">이미지로 저장</button>
        <button type="button" class="btn" data-action="print">인쇄</button>
        <button type="button" class="btn btn--quiet" data-action="reset">체크 지우기</button>
      </div>
    </div>

    <!-- 저장·인쇄 전용. 화면에는 보이지 않습니다. -->
    <div class="export-sheet" id="export-sheet" aria-hidden="true"></div>
  </section>

  <!-- 5. 다녀온 곳 -->
  <section class="visits" id="visits" aria-labelledby="visits-title">
    <h2 class="section__title" id="visits-title">다녀온 곳</h2>
    <ul class="visits__list" data-render="visits"></ul>
    <div class="method" data-render="method"></div>
    <p class="visits__more">
      <a class="btn" href="interview.html" data-render="interview-link"></a>
    </p>
  </section>
</main>

<!-- 6. 하단 -->
<footer class="foot" id="foot">
  <section class="foot__limit" aria-labelledby="limit-title">
    <h2 class="foot__title" id="limit-title" data-render="limit-heading"></h2>
    <p data-render="limit-body"></p>
  </section>
  <section class="foot__baton" aria-labelledby="baton-title">
    <h2 class="foot__title" id="baton-title" data-render="baton-heading"></h2>
    <p data-render="baton"></p>
  </section>
  <section class="foot__contact" aria-labelledby="contact-title">
    <h2 class="foot__title" id="contact-title" data-render="contact-heading"></h2>
    <dl class="contact" data-render="contact-list"></dl>
  </section>
</footer>

<!-- 바텀시트 -->
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet__panel">
    <div class="sheet__grip" aria-hidden="true"></div>
    <header class="sheet__head">
      <p class="sheet__eyebrow" data-render="sheet-eyebrow"></p>
      <h2 class="sheet__title" id="sheet-title" data-render="sheet-title"></h2>
      <button type="button" class="sheet__close" data-action="close-sheet" aria-label="닫기"></button>
    </header>
    <div class="sheet__body" data-render="sheet-body" tabindex="-1"></div>
  </div>
</dialog>

<!-- 반복 단위 템플릿 -->
<template id="tpl-stage">
  <li class="stage">
    <div class="stage__marker" aria-hidden="true"></div>
    <div class="stage__head">
      <h3 class="stage__grade"></h3>
      <p class="stage__caption"></p>
    </div>
    <ul class="stage__items"></ul>
  </li>
</template>

<template id="tpl-fork">
  <li class="stage stage--fork">
    <div class="fork__lines" aria-hidden="true"></div>
    <div class="fork__branches">
      <article class="branch branch--clinical">
        <h3 class="branch__name"></h3>
        <p class="branch__summary"></p>
        <ul class="branch__items"></ul>
      </article>
      <article class="branch branch--nonclinical">
        <h3 class="branch__name"></h3>
        <p class="branch__summary"></p>
        <ul class="branch__items"></ul>
        <ul class="entry" aria-label="대학원 진학 시점"></ul>
      </article>
    </div>
    <div class="fan" data-render="fan"></div>
  </li>
</template>

<template id="tpl-entry">
  <li class="entry__item">
    <h4 class="entry__label"></h4>
    <p class="entry__text"></p>
  </li>
</template>

<template id="tpl-path">
  <li class="path">
    <button type="button" class="path__btn" aria-haspopup="dialog">
      <div class="path__content">
        <h3 class="path__name"></h3>
        <p class="path__degree"></p>
        <p class="path__work"></p>
        <ul class="path__majors"></ul>
      </div>
      <span class="path__more">자세히 보기 &rarr;</span>
    </button>
  </li>
</template>

<template id="tpl-sheet-section">
  <section class="src">
    <p class="src__badge"></p>
    <h3 class="src__title"></h3>
    <div class="src__body"></div>
    <div class="src__groups"></div>
  </section>
</template>

<template id="tpl-check">
  <li class="check__item">
    <label class="check__label">
      <input type="checkbox" class="check__box">
      <span class="check__text"></span>
    </label>
  </li>
</template>

<template id="tpl-choice">
  <li class="check__item check__item--choice">
    <fieldset>
      <legend class="check__text"></legend>
      <div class="choice__options"></div>
    </fieldset>
  </li>
</template>

<template id="tpl-empty">
  <li class="empty">
    <h4 class="empty__text"></h4>
    <p class="empty__note"></p>
    <ul class="empty__programs"></ul>
    <ul class="empty__jobs"></ul>
  </li>
</template>

<template id="tpl-visit">
  <li class="visit">
    <h3 class="visit__region"></h3>
    <p class="visit__period"></p>
    <ul class="visit__places"></ul>
  </li>
</template>

<template id="tpl-lab">
  <li class="lab">
    <div class="lab__head">
      <h3 class="lab__name"></h3>
    </div>
    <p class="lab__full"></p>
    <p class="lab__pi"></p>
    <p class="lab__focus"></p>
    <ul class="lab__paths"></ul>
    <a class="lab__link chip">연구실 정보</a>
  </li>
</template>

<template id="tpl-program">
  <li class="prog">
    <div class="prog__head">
      <span class="prog__kind"></span>
      <strong class="prog__name"></strong>
    </div>
    <p class="prog__when"></p>
    <a class="prog__link btn btn--quiet">바로가기</a>
  </li>
</template>

<script src="script.js" defer></script>
</body>
</html>
