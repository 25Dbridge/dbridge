<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임상병리사의 바이오 진출 로드맵 · D-Bridge</title>

<meta name="description" content="동서대학교 임상병리학과 D-Bridge 팀이 일본 고베와 국내 대전·오송의 기업·연구기관 일곱 곳을 찾아가 정리한 비임상 진로 로드맵">
<meta name="theme-color" content="#201D2B">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="임상병리사는 병원으로만 취업해야 하는가 · D-Bridge">
<meta property="og:description" content="일본·국내 일곱 곳, 현직자 열 명. 임상병리학과 2학년 다섯 명이 정리한 바이오 진출 로드맵">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://25dbridge.github.io/dbridge/">
<meta property="og:image" content="https://25dbridge.github.io/dbridge/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23201D2B'/%3E%3Cpath d='M20 44V20h9c7 0 11 4.5 11 12s-4 12-11 12z' fill='%23F6F5F8'/%3E%3C/svg%3E">

<!-- 다크 모드: 저장된 설정이 있으면 화면이 그려지기 전에 적용 (깜빡임 방지) -->
<script>
  try {
    var t = localStorage.getItem('dbridge-theme');
    if (t) { t = JSON.parse(t); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; }
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>

<!-- 방문자 수 집계 · 통계는 https://dbridge25.goatcounter.com 에서 봅니다 -->
<script data-goatcounter="https://dbridge25.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css?v=309">
</head>

<body>
<a class="skip-link" href="#finder">본문으로 건너뛰기</a>

<noscript>
  <p class="noscript">이 페이지는 자바스크립트로 내용을 표시합니다. 브라우저 설정에서 자바스크립트를 켜고 새로고침해 주세요.</p>
</noscript>

<!-- 상단 바 : 휴대폰에서는 로고와 버튼만, PC에서는 섹션 링크까지 -->
<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <a class="topbar__logo" href="#hero" aria-label="맨 위로">D-Bridge</a>
    <nav class="topbar__nav" aria-label="섹션">
      <a href="#finder">내 길 찾기</a>
      <a href="#paths">세 갈래 길</a>
      <a href="#sim">미리 살아보기</a>
      <a href="#roadmap">로드맵</a>
      <a href="#visits">다녀온 곳</a>
      <a href="#checklist">자가 진단</a>
      <a href="#open">남은 과제</a>
    </nav>
    <div class="topbar__tools">
      <button type="button" class="iconbtn" data-action="share" aria-label="이 페이지 공유하기" title="공유">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 13v6h14v-6"/></svg>
      </button>
      <button type="button" class="iconbtn" data-action="theme" aria-label="어두운 화면으로 바꾸기" title="화면 밝기">
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- 1. 첫 화면 -->
<section class="hero" id="hero" aria-label="소개">
  <div class="hero__bg" aria-hidden="true"><img alt="" loading="eager" decoding="async" data-render="hero-img"></div>
  <div class="hero__inner">
    <h1 class="hero__question" data-render="hero-question"></h1>
    <p class="hero__answer" data-render="hero-answer"></p>
    <p class="hero__lead" data-render="hero-lead"></p>
    <p class="hero__cta"><a class="btn btn--light" href="#finder" data-render="hero-cta"></a></p>
    <dl class="hero__stats" data-render="hero-stats"></dl>
    <p class="hero__project" data-render="hero-project"></p>
    <p class="hero__team" data-render="hero-team"></p>
  </div>
</section>

<main>
  <!-- 2. 나의 경로 찾기 -->
  <section class="finder" id="finder" aria-labelledby="finder-title">
    <h2 class="section__title" id="finder-title" data-render="finder-heading"></h2>
    <p class="section__lead" data-render="finder-lead"></p>

    <div class="finder__grid">
    <div class="finder__pick">
      <div class="pick" role="group" aria-labelledby="pick-grade-label">
        <p class="pick__label" id="pick-grade-label" data-render="finder-grade-label"></p>
        <div class="pick__options" data-render="finder-grades"></div>
      </div>
      <div class="pick" role="group" aria-labelledby="pick-goal-label">
        <p class="pick__label" id="pick-goal-label" data-render="finder-goal-label"></p>
        <div class="pick__options" data-render="finder-goals"></div>
      </div>
    </div>

    <div class="finder__result" id="finder-result" aria-live="polite" data-render="finder-result"></div>
    </div>
  </section>

  <!-- 2b. 4년 미리 살아보기 -->
  <section class="sim" id="sim" aria-labelledby="sim-title">
    <h2 class="section__title" id="sim-title" data-render="sim-heading"></h2>
    <p class="section__lead" data-render="sim-lead"></p>
    <div class="scene" data-render="sim-stage"></div>
  </section>

  <!-- 3. 세 갈래 -->
  <section class="paths" id="paths" aria-labelledby="paths-title">
    <h2 class="section__title" id="paths-title" data-render="paths-heading"></h2>
    <p class="section__lead" data-render="paths-lead"></p>
    <ul class="paths__list" data-render="paths"></ul>
  </section>

  <!-- 4. 로드맵 -->
  <section class="roadmap" id="roadmap" aria-labelledby="roadmap-title">
    <h2 class="section__title" id="roadmap-title" data-render="roadmap-heading"></h2>
    <p class="roadmap__notice" data-render="roadmap-notice" role="note"></p>
    <ol class="timeline" data-render="timeline"></ol>
  </section>

  <!-- 6. 다녀온 곳 -->
  <section class="visits" id="visits" aria-labelledby="visits-title">
    <h2 class="section__title" id="visits-title" data-render="visits-heading"></h2>
    <p class="section__lead" data-render="visits-lead"></p>

    <div class="filters">
      <div class="filter" role="group" aria-labelledby="f-country">
        <span class="filter__label" id="f-country" data-render="visits-country-label"></span>
        <div class="filter__options" data-render="visits-countries"></div>
      </div>
      <div class="filter" role="group" aria-labelledby="f-type">
        <span class="filter__label" id="f-type" data-render="visits-type-label"></span>
        <div class="filter__options" data-render="visits-types"></div>
      </div>
    </div>

    <ol class="stops" data-render="stops"></ol>
    <p class="stops__none" data-render="stops-none" hidden></p>

    <div class="method" data-render="method"></div>
    <p class="visits__more">
      <a class="btn" href="interview.html" data-render="interview-link"></a>
    </p>
  </section>

  <!-- 7. 체크리스트 -->
  <section class="checklist" id="checklist" aria-labelledby="checklist-title">
    <h2 class="section__title" id="checklist-title" data-render="checklist-heading"></h2>
    <p class="section__lead" data-render="checklist-lead"></p>

    <section class="tree" aria-labelledby="tree-title">
      <div class="tree__head">
        <h3 class="tree__title" id="tree-title" data-render="tree-heading"></h3>
        <p class="tree__count" data-render="tree-count" aria-live="polite"></p>
      </div>
      <p class="tree__lead" data-render="tree-lead"></p>
      <div class="tree__rows" data-render="tree-rows"></div>
    </section>

    <div class="checklist__grid">
    <div class="checklist__left">
    <div class="grades" role="tablist" aria-label="학년 선택" data-render="grade-tabs"></div>

    <form class="check" id="check-form" role="tabpanel" aria-label="선택한 학년의 점검 문항">
      <fieldset class="check__group" data-group="now">
        <legend class="check__legend" data-render="legend-now"></legend>
        <ul class="check__list" data-render="items-now"></ul>
      </fieldset>
      <fieldset class="check__group" data-group="ongoing">
        <legend class="check__legend" data-render="legend-ongoing"></legend>
        <ul class="check__list" data-render="items-ongoing"></ul>
      </fieldset>
      <p class="check__saved" data-render="check-saved" aria-live="polite"></p>
    </form>
    </div>

    <div class="result" id="result" aria-live="polite">
      <h3 class="result__heading" data-render="result-heading"></h3>
      <ul class="result__list" data-render="result-list"></ul>
      <div class="result__preview" data-render="result-preview" hidden></div>
      <div class="result__done" data-render="result-done" hidden></div>
      <div class="result__actions">
        <button type="button" class="btn" data-action="save-image">이미지로 저장</button>
        <button type="button" class="btn btn--quiet" data-action="programs" data-render="programs-button"></button>
        <button type="button" class="btn btn--quiet" data-action="reset">체크 지우기</button>
      </div>
    </div>
    </div>
    <div class="export-sheet" id="export-sheet" aria-hidden="true"></div>
  </section>

  <!-- 8. 사진 -->
  <section class="gallery" id="gallery" aria-labelledby="gallery-title">
    <h2 class="section__title" id="gallery-title" data-render="gallery-heading"></h2>
    <p class="section__lead" data-render="gallery-lead"></p>
    <ul class="gallery__grid" data-render="gallery"></ul>
  </section>

  <!-- 9. 확인하지 못한 것 -->
  <section class="open" id="open" aria-labelledby="open-title">
    <h2 class="section__title" id="open-title" data-render="open-heading"></h2>
    <p class="section__lead" data-render="open-lead"></p>

    <h3 class="open__sub" data-render="open-limits-label"></h3>
    <dl class="limits" data-render="open-limits"></dl>

    <div class="baton">
      <h3 class="open__sub" data-render="baton-heading"></h3>
      <p data-render="baton"></p>
    </div>
  </section>
</main>

<!-- 10. 하단 -->
<footer class="foot" id="foot">
  <div class="foot__inner">
    <section class="foot__block" aria-labelledby="note-title">
      <h2 class="foot__title" id="note-title" data-render="note-heading"></h2>
      <p data-render="note-body"></p>
    </section>
    <section class="foot__block" aria-labelledby="contact-title">
      <h2 class="foot__title" id="contact-title" data-render="contact-heading"></h2>
      <dl class="contact" data-render="contact-list"></dl>
    </section>
    <p class="foot__credits" data-render="credits"></p>
    <p class="foot__share">
      <button type="button" class="btn btn--quiet" data-action="share" data-render="share-button"></button>
    </p>
  </div>
</footer>

<!-- 휴대폰 하단 탭 -->
<nav class="tabbar" aria-label="섹션 이동">
  <a href="#finder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 12h8l4-4 4 4M12 12v7"/></svg><span>내 길 찾기</span></a>
  <a href="#roadmap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M6 7h12l-3 3 3 3H6"/></svg><span>로드맵</span></a>
  <a href="#sim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9l6 3-6 3z"/></svg><span>미리 살아보기</span></a>
  <a href="#visits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>다녀온 곳</span></a>
  <a href="#checklist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg><span>자가 진단</span></a>
</nav>

<!-- 바텀시트 (휴대폰) / 사이드 패널 (PC) -->
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet__panel">
    <div class="sheet__grip" aria-hidden="true"></div>
    <header class="sheet__head">
      <p class="sheet__eyebrow" data-render="sheet-eyebrow"></p>
      <h2 class="sheet__title" id="sheet-title" data-render="sheet-title"></h2>
      <button type="button" class="sheet__close" data-action="close-sheet" aria-label="닫기"></button>
    </header>
    <div class="sheet__body" data-render="sheet-body" tabindex="-1"></div>
  </div>
</dialog>

<!-- 사진 크게 보기 -->
<dialog class="lightbox" id="lightbox" aria-label="사진 크게 보기">
  <button type="button" class="lightbox__close" data-action="close-lightbox" aria-label="닫기"></button>
  <figure class="lightbox__fig">
    <img alt="" data-render="lightbox-img">
    <figcaption data-render="lightbox-cap"></figcaption>
  </figure>
</dialog>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<!-- 용어 풀이 말풍선 -->
<div class="termpop" id="termpop" role="dialog" aria-label="용어 풀이" hidden>
  <p class="termpop__term"></p>
  <p class="termpop__text"></p>
  <button type="button" class="termpop__close" aria-label="닫기"></button>
</div>

<!-- 반복 단위 템플릿 -->
<template id="tpl-path">
  <li class="path">
    <button type="button" class="path__btn" aria-haspopup="dialog">
      <span class="path__num"></span>
      <span class="path__body">
        <span class="path__name"></span>
        <span class="path__degree"></span>
        <span class="path__work"></span>
        <span class="path__courses"></span>
        <span class="path__basis"></span>
      </span>
      <span class="path__more">자세히</span>
    </button>
  </li>
</template>

<template id="tpl-stage">
  <li class="stage">
    <details class="stage__box">
      <summary class="stage__head">
        <span class="stage__marker" aria-hidden="true"></span>
        <span class="stage__grade"></span>
        <span class="stage__caption"></span>
      </summary>
      <ul class="stage__items"></ul>
    </details>
  </li>
</template>

<template id="tpl-fork">
  <li class="stage stage--fork">
    <details class="stage__box">
      <summary class="stage__head">
        <span class="stage__marker" aria-hidden="true"></span>
        <span class="stage__grade"></span>
        <span class="stage__caption"></span>
      </summary>
      <div class="fork">
        <article class="branch branch--clinical">
          <h4 class="branch__name"></h4>
          <p class="branch__summary"></p>
          <ul class="branch__items"></ul>
        </article>
        <article class="branch branch--nonclinical">
          <h4 class="branch__name"></h4>
          <p class="branch__summary"></p>
          <ul class="branch__items"></ul>
          <dl class="entry" aria-label="대학원 진학 시점"></dl>
        </article>
      </div>
    </details>
  </li>
</template>


<template id="tpl-stop">
  <li class="stop">
    <div class="stop__date"><span class="stop__day"></span><span class="stop__time"></span></div>
    <details class="stop__box">
      <summary class="stop__head">
        <span class="stop__tags"></span>
        <span class="stop__name"></span>
        <span class="stop__kind"></span>
      </summary>
      <div class="stop__body">
        <dl class="stop__info"></dl>
        <ul class="stop__photos"></ul>
        <p class="stop__qa"><a class="btn btn--quiet"></a></p>
      </div>
    </details>
  </li>
</template>

<template id="tpl-check">
  <li class="check__item">
    <label class="check__label">
      <input type="checkbox" class="check__box">
      <span class="check__text"></span>
    </label>
  </li>
</template>

<template id="tpl-choice">
  <li class="check__item check__item--choice">
    <fieldset>
      <legend class="check__text"></legend>
      <div class="choice__options"></div>
    </fieldset>
  </li>
</template>

<template id="tpl-empty">
  <li class="empty">
    <h4 class="empty__text"></h4>
    <p class="empty__note"></p>
    <div class="empty__progs"></div>
    <ul class="empty__jobs"></ul>
  </li>
</template>

<template id="tpl-program">
  <li class="prog">
    <span class="prog__kind"></span>
    <strong class="prog__name"></strong>
    <span class="prog__when"></span>
    <a class="prog__link">바로가기</a>
  </li>
</template>

<script src="data.js?v=309"></script>
<script src="common.js?v=309"></script>
<script src="script.js?v=309" defer></script>
</body>
</html>
